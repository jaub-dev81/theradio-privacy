<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Radio — Ouverture...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0D0D1A;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #1A1A2E;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 360px;
      width: 100%;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .station { color: #6C63FF; font-size: 18px; font-weight: 600; margin-bottom: 24px; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #2a2a4a;
      border-top-color: #6C63FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #9CA3AF; font-size: 14px; margin-bottom: 24px; }
    .btn {
      display: block;
      background: #6C63FF;
      color: #fff;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📻</div>
    <h1>The Radio</h1>
    <div class="station" id="station-name">Chargement...</div>
    <div class="spinner"></div>
    <p id="status">Ouverture de l'application...</p>
    <a id="store-btn" class="btn" href="https://play.google.com/store/apps/details?id=com.theradio.app" style="display:none">
      📲 Télécharger The Radio
    </a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id      = params.get('id')     || '';
    const name    = params.get('name')   || 'Station Radio';
    const stream  = params.get('stream') || '';
    const favicon = params.get('favicon')|| '';
    const country = params.get('country')|| '';

    document.getElementById('station-name').textContent = name;

    // Construire le deep link theradio://
    const deepParams = new URLSearchParams({ id, name, stream, favicon, country });
    const deepLink = 'theradio://open/station?' + deepParams.toString();

    // Tenter d'ouvrir l'app
    window.location.href = deepLink;

    // Fallback : si l'app n'est pas installée, afficher le bouton Play Store
    setTimeout(() => {
      document.getElementById('status').textContent =
        'Application non installée ? Télécharge-la sur le Play Store.';
      document.getElementById('store-btn').style.display = 'block';
      document.querySelector('.spinner').style.display = 'none';
    }, 2000);
  </script>
</body>
</html>
